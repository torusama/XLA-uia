[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "xla-vit-efficientvit"
version = "0.1.0"
description = "Phase 0 research scaffold for ViT and EfficientViT"
requires-python = ">=3.10"
dependencies = ["PyYAML>=6"]

[project.optional-dependencies]
dev = ["pytest>=7", "ruff>=0.4"]
vit = ["torch>=2", "torchvision", "timm>=1.0", "Pillow"]

[tool.hatch.build]
dev-mode-exact = true

[tool.hatch.build.targets.wheel]
packages = ["src/xla"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
target-version = "py310"
line-length = 100
